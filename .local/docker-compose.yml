name: ${COMPOSE_PROJECT_NAME:-claude-sandbox}

services:
  claude:
    build: .
    # Per-project tag: every cloned project builds and runs its OWN image.
    # A shared `:latest` tag let the last-built project's image silently win
    # for everyone else (e.g. an image without the chrome channel). The tag
    # tracks COMPOSE_PROJECT_NAME, which the start/rebuild scripts export.
    image: claude-dangerous:${COMPOSE_PROJECT_NAME:-claude-sandbox}
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    volumes:
      - ../:/workspace
      - claude-config:/home/node/.claude
      - claude-cache:/home/node/.cache
    env_file:
      - ../.env
    environment:
      - DISPLAY=host.docker.internal:0.0
      - LIBGL_ALWAYS_INDIRECT=1
      - TERM=xterm-256color
      # Tells wp-config.php to load wp-config.local.php when claude runs `wp` locally.
      - PANTHEON_ENVIRONMENT=local
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: claude --dangerously-skip-permissions

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: db
      MARIADB_USER: db
      MARIADB_PASSWORD: db
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - wp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mail catcher. WordPress sends every wp_mail() here over SMTP (wired up by
  # the mu-plugin the wp-entrypoint installs), so password resets and
  # notifications are readable instead of silently dropped.
  #   Web UI:   http://localhost:8025  (host)  /  http://mailpit:8025  (containers)
  #   JSON API: http://mailpit:8025/api/v1/messages
  # Storage is in-memory: mail is discarded when the container stops.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # Host port is overridable because Windows/Hyper-V sometimes reserves a
      # range that swallows 8025:  MAILPIT_PORT=8225 ./.local/compose.sh up -d
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      # Cap the ring buffer so a runaway plugin can't grow the container.
      MP_MAX_MESSAGES: "500"
      # Sandbox: accept whatever credentials a plugin is configured with
      # rather than rejecting the message.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      # Mask sandbox-only paths so WP/plugins don't see or scan them.
      - /var/www/html/.local
      - /var/www/html/.sass
      - /var/www/html/.playwright-mcp
      - ./php-memory.ini:/usr/local/etc/php/conf.d/zz-memory.ini:ro
      - ./wp-entrypoint.sh:/usr/local/bin/wp-entrypoint.sh:ro
      # Source for the mu-plugins the entrypoint installs into wp-content.
      # Mounted outside the docroot because .local is masked above, so the
      # entrypoint cannot read it from /var/www/html/.local. Mounted as a
      # directory, not file-by-file: a single-file bind mount breaks on
      # `docker compose restart` as soon as the host file is rewritten, since
      # editors replace the inode the mount was pinned to.
      - ./wp-mu-plugins:/usr/local/share/sandbox-mu-plugins:ro
    # Remap www-data to the host user so Apache can write bind-mounted files.
    entrypoint: ["/usr/local/bin/wp-entrypoint.sh"]
    command: ["apache2-foreground"]
    environment:
      # Host user identity for the www-data remap (overridable; defaults match
      # a typical single-user WSL/Linux setup).
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: db
      WORDPRESS_DB_USER: db
      # Must match MARIADB_PASSWORD above — the db user's password is "db",
      # not the root password.
      WORDPRESS_DB_PASSWORD: db
      # Signals to wp-config.php that this is the sandbox - the dev wires
      # wp-config.php to include wp-config.local.php when this is "local".
      PANTHEON_ENVIRONMENT: local

  # One-off wp-cli runner. Invoke with:
  #   docker compose -f .local/docker-compose.yml run --rm wp-cli wp <command>
  #
  # Built from wordpress:cli rather than used directly, only to repair that
  # image's Imagick (see Dockerfile.wp-cli). Per-project tag for the same reason
  # the claude image has one.
  wp-cli:
    build:
      context: .
      dockerfile: Dockerfile.wp-cli
    image: wp-cli-imagick:${COMPOSE_PROJECT_NAME:-claude-sandbox}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../:/var/www/html
      # Mask sandbox-only paths so wp-cli doesn't see them.
      - /var/www/html/.local
      - /var/www/html/.sass
      - /var/www/html/.playwright-mcp
      - ./php-memory.ini:/usr/local/etc/php/conf.d/zz-memory.ini:ro
    environment:
      # Tells wp-config.php to load wp-config.local.php (sandbox creds).
      PANTHEON_ENVIRONMENT: local
    profiles: ["cli"]

  # SASS compiler runner. Shares the claude image (sass/postcss/autoprefixer
  # are baked in). Used by .local/sass.sh when invoked from the host. Claude,
  # running inside its own container from the same image, can also call
  # .local/sass.sh — the script detects the in-container context and runs the
  # node runner directly without involving docker, so this service is the
  # host-side entry point.
  sass:
    build: .
    # Shares the claude image — keep this tag identical to the claude service.
    image: claude-dangerous:${COMPOSE_PROJECT_NAME:-claude-sandbox}
    working_dir: /workspace
    volumes:
      - ../:/workspace
      - claude-cache:/home/node/.cache
    # No tty/stdin_open: sass is a batch process. With tty:true, calling this
    # service through a non-TTY stdin (e.g. from a piped bash invocation) hangs
    # docker compose run waiting on a pseudo-TTY it can't allocate. SIGINT
    # (Ctrl+C) still propagates to watch-mode without a TTY.
    profiles: ["sass"]

volumes:
  claude-config:
  claude-cache:
  wp-db:
